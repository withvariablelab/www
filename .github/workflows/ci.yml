name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome's format and lint, then astro check's types.
      - name: 🔍 Check
        run: pnpm rr check

      - name: 🏗️ Build site
        run: pnpm astro build

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install_args: gitleaks
          cache: true

      - name: 🔐 Scan the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gitleaks git --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA"

  # The ruleset requires a check named "Check": this job reports the site's check and build and the secret scan under
  # that name. It runs even when one of them fails, since a required check that is skipped counts as passed.
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [site, secrets]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: ✅ The site passed and no secret leaked
        env:
          SITE: ${{ needs.site.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: test "$SITE" = "success" && test "$SECRETS" = "success"
