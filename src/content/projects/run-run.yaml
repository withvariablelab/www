name: "run-run"
class: "App"
sign: "M2 2h12v8h8v12H10v-8H2V2z"
tagline: "One way to run the scripts in a repo."
body: "Every tool is a plugin you add: Biome, oxc, tsc or tsdown. The commands stay the same in every repo."
installCommand: "pnpm add -D @rrlab/cli"
executable: "rr"
package: "@rrlab/cli"
requirement: "Node 22.18 or later"
repository: "https://github.com/withvariablelab/dx/tree/main/run-run/cli"
links:
  - name: "CLI reference"
    url: "https://github.com/withvariablelab/dx/blob/main/run-run/cli/CLI.md"
  - name: "GitHub"
    url: "https://github.com/withvariablelab/dx/tree/main/run-run/cli"
example:
  snippets:
    - groups:
        - comment: "add the tools, one per call"
          commands:
            - "pnpm rr plugins add biome"
            - "pnpm rr plugins add ts"
            - "pnpm rr plugins add tsdown"
        - comment: "format, lint and type-check"
          commands:
            - "pnpm rr check"
        - comment: "compile and emit types"
          commands:
            - "pnpm rr pack"
closingLine: "Ships no Biome or TypeScript. Each plugin installs its tool."
description: "One way to run the scripts in a repo. Every tool is a plugin you add: Biome, oxc, tsc or tsdown."
